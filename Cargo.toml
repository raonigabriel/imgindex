[package]
name = "imgindex"
version = "0.14.0"
edition = "2024"
description = "Append-only local image index: content hashing, perceptual hashes and SigLIP 2 embeddings with USearch vector search"
license = "Apache-2.0"

[dependencies]
# restore default SIGPIPE handling so piping output into `head` etc.
# doesn't panic the process
libc = "0.2"
# CLI
clap = { version = "4", features = ["derive"] }
# directory traversal
walkdir = "2"
# content / path hashing
sha2 = "0.10"
hex = "0.4"
# mime sniffing from magic bytes (never trust the extension)
infer = "0.16"
# image decoding: dimensions + perceptual hash (pHash). Decoders shipped
# in the binary: JPEG, PNG, WebP, TIFF, GIF, BMP.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
# zlib decoding for compressed PNG text chunks (zTXt / iTXt)
flate2 = "1"
# sqlite, statically linked; SQLCipher build so `--key` works (AES-256).
# "functions" enables registering the hamming64() scalar UDF.
# The database stays 100% standard SQLite — no extensions embedded.
# SQLCipher's crypto comes from the vendored OpenSSL feature below;
# ort-sys's build-time model downloader links the build container's
# system OpenSSL instead (release.yml installs libssl-dev for it) —
# neither ships in the runtime image.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
# vector search: pHash embeddings live in a separate USearch proximity-
# graph index file (image_vectors.safegraphs). Needs cmake + g++ at BUILD
# time only; the binary is self-contained.
usearch = "2.26"
# ONNX Runtime bindings for SigLIP 2 image embeddings (--generate-
# embeddings). CPU execution provider by default; GPU EPs are opt-in
# cargo features (cuda / directml / coreml). Prebuilt ORT binaries are
# downloaded by ort-sys at build time.
ort = { version = "=2.0.0-rc.15" }
# Hugging Face cache + download client (same cache layout as `hf
# download` / the Python client; respects HF_HOME / HF_HUB_CACHE).
# Model files are downloaded into the OFFICIAL HF cache — shared with
# hf CLI, transformers, etc.
hf-hub = { version = "1.0", features = ["blocking"] }
# Hugging Face tokenizer (SentencePiece/BPE) for SigLIP 2 text queries
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# EXIF metadata (JPEG/TIFF containers, plus PNG/WebP Exif chunks)
kamadak-exif = "0.6"
serde_json = "1"

[profile.release]
lto = true
