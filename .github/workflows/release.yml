name: Release (binaries + Docker)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Native builds, one job per architecture, in parallel. Each runs inside
  # an ubuntu:26.04 container on a NATIVE runner — no QEMU, so the arm64
  # build is as fast as the amd64 one. Build and runtime glibc move
  # together: the Dockerfile runtime image is ubuntu:26.04 too (the
  # binary's glibc symbol floor — 2.43, float-math symbols via
  # ORT/USearch — comes from the build container), and the docker job
  # smoke-tests the pushed image so a build/runtime mismatch fails CI
  # instead of shipping. libssl-dev is build-time only: ort-sys's model
  # downloader links it; nothing of it ships in the runtime image.
  build:
    name: Build linux/${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake curl ca-certificates perl pkg-config git libssl-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        run: |
          # the binary's --version is baked from Cargo.toml at compile
          # time; refuse to ship a release whose tag disagrees with it.
          # workflow_dispatch runs have no vX.Y.Z ref — skip there.
          case "${GITHUB_REF_NAME}" in
            v*)
              CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
              TAG_VER="${GITHUB_REF_NAME#v}"
              echo "Cargo.toml: $CARGO_VER, tag: v$TAG_VER"
              [ "$CARGO_VER" = "$TAG_VER" ] || {
                echo "::error::tag v$TAG_VER != Cargo.toml version $CARGO_VER — bump Cargo.toml (and commit the updated Cargo.lock), then re-tag"
                exit 1
              }
              ;;
            *) echo "not a tag push, skipping version check" ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: imgindex-${{ matrix.arch }}

      - name: Build (release)
        run: cargo build --release

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && VERSION="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD 2>/dev/null || echo dispatch)"
          mkdir -p pkg
          cp target/release/imgindex pkg/imgindex
          cp LICENSE README.md pkg/ 2>/dev/null || true
          tar -czf "imgindex-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: imgindex-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Multi-arch Docker image. No compilation happens here — the binaries
  # come from the build matrix — and the runtime Dockerfile only does
  # COPY over a distroless base, so no QEMU is required. Both platforms
  # are built from one context in one buildx call, producing a single
  # multi-arch manifest on GHCR.
  docker:
    name: Docker image (amd64 + arm64)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packaged binaries
        uses: actions/download-artifact@v5
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Prepare build context (per-arch binaries)
        run: |
          mkdir -p docker-context
          cp Dockerfile docker-context/
          for tarball in dist/imgindex-*-linux-*.tar.gz; do
            case "$tarball" in
              *x86_64*) arch=amd64 ;;
              *aarch64*) arch=arm64 ;;
              *) echo "unknown arch in $tarball"; exit 1 ;;
            esac
            # Package step stores members as ./imgindex etc., so extract
            # the whole archive instead of requesting a member by name
            tmp=$(mktemp -d)
            tar -xzf "$tarball" -C "$tmp"
            mv "$tmp/imgindex" "docker-context/imgindex-linux-${arch}"
            rm -rf "$tmp"
          done
          ls -l docker-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=true keeps the floating :latest alias on whichever
          # version is being released (this workflow only ever pushes
          # v* tags), so `docker pull ghcr.io/<repo>:latest` always
          # resolves to the newest release — the README examples and
          # the cosign step below rely on it. The action's default
          # (latest=auto) would do the same today; this pins the
          # behavior so it cannot regress silently.
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        # exact pin: upstream publishes no floating v4 tag, so @v4
        # cannot be resolved by the runner (2026-11 setup failures)
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the published image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Smoke test the published image
        if: startsWith(github.ref, 'refs/tags/v')
        # run the binary inside the final runtime image: proves the
        # build/runtime glibc pairing before the release is callable
        run: |
          docker run --rm --platform linux/amd64 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
            --version

  # GitHub release with the packaged binaries (tag pushes only).
  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v5
        with:
          pattern: linux-*
          path: release-pkg
          merge-multiple: true

      - name: Extract per-arch binaries
        run: |
          for tarball in release-pkg/imgindex-*-linux-*.tar.gz; do
            case "$tarball" in
              *x86_64*) arch=amd64 ;;
              *aarch64*) arch=arm64 ;;
              *) echo "unknown arch in $tarball"; exit 1 ;;
            esac
            tmp=$(mktemp -d)
            tar -xzf "$tarball" -C "$tmp"
            mv "$tmp/imgindex" "imgindex-linux-${arch}"
            rm -rf "$tmp"
          done
          ls -l imgindex-linux-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: imgindex-linux-*
          generate_release_notes: true
          # force-updating a tag can flip its release to draft; publish
          # explicitly so every run leaves a visible, downloadable release
          draft: false
